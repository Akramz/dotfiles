# tmux — one session per agent task; `tp` (see config/tp/tp_tui.py) is how you
# move between them. Reload with `tmux source-file ~/.tmux.conf`.

# Shift+Ctrl+Left/Right cycles sessions without a prefix key.
bind -n S-C-Left switch-client -p
bind -n S-C-Right switch-client -n

# Cmd+Shift+Left/Right moves between panes. Ghostty sends these private
# sequences for those keys (config/ghostty/config).
set -s user-keys[0] "\e[9001~"
set -s user-keys[1] "\e[9002~"
bind -n User0 select-pane -L
bind -n User1 select-pane -R

# Mouse: scroll, select panes, drag to copy.
set -g mouse on

# Pass terminal focus in/out through to the programs inside the pane.
set -g focus-events on

# Agents emit OSC sequences (images, notifications) that must reach Ghostty.
set -gq allow-passthrough on

# C-l is clear-input inside the agent TUIs, not tmux's clear-screen.
unbind C-l

# ── Plugins (TPM) ───────────────────────────────────────────────
# resurrect + continuum bring sessions back after a reboot or VM stop/start:
# continuum saves every 5 minutes and restores when the server next starts.
# Running processes can't survive; claude and copilot panes relaunch with
# --resume <their own session ID>. The agents save strategy lives in
# config/tmux-resurrect/. Plugins are cloned by install.sh.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-save-command-strategy 'agents'
set -g @resurrect-processes 'claude copilot'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# True color
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm*:Tc:smcup@:rmcup@"
set -ag terminal-overrides ",*256col*:Tc"

# Performance
set -sg escape-time 0
set -g history-limit 50000

# Extended keys let shift+enter survive Ghostty -> tmux -> agent CLI; without
# them it submits instead of inserting a newline. Delivered as ESC[13;2u (the
# kitty form Claude Code reads), not xterm modifyOtherKeys. `sync` is
# synchronized output (less flicker). -q: a tmux < 3.2 (a distro binary found
# before brew's) lacks these options; skip quietly instead of erroring.
set -sq extended-keys on
set -sq extended-keys-format csi-u
set -asq terminal-features 'xterm-ghostty:extkeys:sync,tmux-256color:extkeys'

# Wheel up: pass to apps that want the mouse, else scroll in copy-mode.
bind-key -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"

# One line per wheel step in copy-mode (tmux default is 5).
bind-key -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X scroll-down
bind-key -T copy-mode WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode WheelDownPane send-keys -X scroll-down

# Clipboard integration (drag-to-copy). OSC 52 reaches the outer terminal on
# both machines; macOS also pipes to pbcopy; Linux has none.
set -g set-clipboard on
set -as terminal-overrides ",xterm*:Ms=\\E]52;%p1%s;%p2%s\\007"
if-shell 'command -v pbcopy >/dev/null' \
  'bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"; bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"' \
  'bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel; bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-and-cancel'

# Initialize TPM — keep this line at the very bottom
run '~/.tmux/plugins/tpm/tpm'
